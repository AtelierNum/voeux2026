<!DOCTYPE html>
<html>
<head>
  <title>Voeux</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="./script.js"></script>
  <style>
    #enter-ar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column; /* Arrange buttons vertically */
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 9999;
    }

    .enter-ar-btn { /* Common styles for both buttons */
      padding: 20px 40px;
      font-size: 24px;
      background-color: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      margin-bottom: 20px; /* Add some space between buttons */
    }

    #enter-ar-logo-btn {
      background-image: url('assets/logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
      width: 300px; /* Adjust size as needed */
      height: 150px; /* Adjust size as needed */
      border: none;
    }
  </style>
</head>
<body style='margin : 0px; overflow: hidden;'>
  <div id="enter-ar-container">
    <button id="enter-ar-logo-btn" class="enter-ar-btn"></button>
    <button id="enter-ar-btn" class="enter-ar-btn">L'École de design Nantes Atlantique vous souhaite une excellente année 2026</button>
    
  </div>

  <a-scene id="ar-scene" embedded arjs='sourceType: webcam; debugUIEnabled: false;' vr-mode-ui="enabled: false">
    <a-camera>
      <a-cursor geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01" material="color: black; shader: flat"></a-cursor>
    </a-camera>

    <a-assets>

      <video id="03" loop="true" src="assets/03.mp4" playsinline webkit-playsinline></video>

    <!-- Video wall layout... -->
    <a-video src="#01" width="72" height="40.5" position="-110.29 40.5 -47.27" rotation="0 66.8 0" material="shader: flat; opacity: 0.75;" gaze-interaction></a-video>
    <a-video src="#02" width="72" height="40.5" position="-66.06 40.5 -100.18" rotation="0 33.4 0" material="shader: flat; opacity: 0.75;" gaze-interaction></a-video>
